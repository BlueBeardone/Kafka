services:
  kafka:
    build: .
    container_name: kafka
    ports:
      - "8080:8080"
    environment:
      FISCHL_IDENTITY_URL: http://host.docker.internal:9090
      FISCHL_BASTION_URL: http://host.docker.internal:9090
      FISCHL_FACILITIES_URL: http://host.docker.internal:9090
      FISCHL_NEWSPAPERS_URL: http://host.docker.internal:9090
      FISCHL_DEFENDER_URL: http://host.docker.internal:9090
      FISCHL_HIRELING_URL: http://host.docker.internal:9090
