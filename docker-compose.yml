services:
  kafka:
    build: .
    container_name: kafka
    # Bounds total container memory. The native image runs comfortably under this;
    # it also makes Dockerfile.jvm's -XX:MaxRAMPercentage=50 resolve to a sane heap.
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      FISCHL_IDENTITY_URL: http://host.docker.internal:3001
      FISCHL_BASTION_URL: http://host.docker.internal:3002
      FISCHL_FACILITIES_URL: http://host.docker.internal:3002
      FISCHL_DEFENDER_URL: http://host.docker.internal:3002
      FISCHL_HIRELING_URL: http://host.docker.internal:3002
