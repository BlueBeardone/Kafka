quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:/https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?/}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=origin,content-type,accept,authorization

quarkus.http.limits.max-header-size=32768
quarkus.http.limits.max-header-list-size=32768

## Fischl Backend URLs
quarkus.rest-client.fischl-identity-api.url=${FISCHL_IDENTITY_URL:http://localhost:9090}/api/v1/repository/users
quarkus.rest-client.fischl-bastion-api.url=${FISCHL_BASTION_URL:http://localhost:9090}/api/v1/repository/bastions
quarkus.rest-client.fischl-facilities-api.url=${FISCHL_FACILITIES_URL:http://localhost:9090}/api/v1/repository/facilities
quarkus.rest-client.fischl-newspapers-api.url=${FISCHL_NEWSPAPERS_URL:http://localhost:9090}/api/v1/repository/newspapers
quarkus.rest-client.fischl-defender-api.url=${FISCHL_DEFENDER_URL:http://localhost:9090}/api/v1/repository/defenders
quarkus.rest-client.fischl-hireling-api.url=${FISCHL_HIRELING_URL:http://localhost:9090}/api/v1/repository/hirelings

## OpenAPI
quarkus.swagger-ui.enable=false
quarkus.smallrye-openapi.info-title=Kafka API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Kafka middleware API for Maura Bastion frontend. Aggregates downstream services and exposes REST endpoints.
