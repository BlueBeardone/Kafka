quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:/https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?/}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=origin,content-type,accept,authorization

quarkus.http.limits.max-header-size=32768
quarkus.http.limits.max-header-list-size=32768

## Fischl Backend URLs
## Note: the REST client base URL is combined with the connector @Path.
## identity connector uses /auth, /users, /roles, /apps -> mount prefix /identity
## bastions/facilities/defenders/hirelings connectors carry the resource path -> base is service root
## newspapers connector is root -> mount prefix /newspapers
quarkus.rest-client.fischl-identity-api.url=${FISCHL_IDENTITY_URL:http://localhost:3001}/identity
quarkus.rest-client.fischl-bastion-api.url=${FISCHL_BASTION_URL:http://localhost:3002}
quarkus.rest-client.fischl-facilities-api.url=${FISCHL_FACILITIES_URL:http://localhost:3002}
quarkus.rest-client.fischl-newspapers-api.url=${FISCHL_NEWSPAPERS_URL:http://localhost:3002}/newspapers
quarkus.rest-client.fischl-defender-api.url=${FISCHL_DEFENDER_URL:http://localhost:3002}
quarkus.rest-client.fischl-hireling-api.url=${FISCHL_HIRELING_URL:http://localhost:3002}

## Discord webhook URLs (one per channel; unset => route returns a 500 "not configured" error)
discord.webhook.general.url=${DISCORD_WEBHOOK_URL:}
discord.webhook.individual-bastion-turn.url=${DISCORD_WEBHOOK_INDIVIDUAL_BASTION_TURN_URL:}
discord.webhook.bastion-creation.url=${DISCORD_WEBHOOK_BASTION_CREATION_URL:}
discord.webhook.facility-built.url=${DISCORD_WEBHOOK_FACILITY_BUILT_URL:}
discord.webhook.facility-rank-up.url=${DISCORD_WEBHOOK_FACILITY_RANK_UP_URL:}
discord.webhook.branch-upgrade.url=${DISCORD_WEBHOOK_BRANCH_UPGRADE_URL:}
discord.webhook.hireling-hired.url=${DISCORD_WEBHOOK_HIRELING_HIRED_URL:}
discord.webhook.defender-acquired.url=${DISCORD_WEBHOOK_DEFENDER_ACQUIRED_URL:}

## OpenAPI
quarkus.swagger-ui.enable=false
quarkus.smallrye-openapi.info-title=Kafka API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Kafka middleware API for Maura Bastion frontend and Tsaritsa admin app. Aggregates downstream services and exposes REST endpoints.

