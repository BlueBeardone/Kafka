# REST-client logging: DEBUG produced heavy per-request log allocation/IO on the
# hot path. WARN keeps the noise down; no file logging in normal operation.
quarkus.log.category."org.jboss.resteasy.reactive.client".level=WARN
quarkus.log.category."io.quarkus.rest.client.reactive".level=WARN
quarkus.log.file.enable=false
